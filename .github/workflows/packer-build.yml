name: Golden Image Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'build/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cleanup-s4.yml'
      - '.github/workflows/packer-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'build/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cleanup-s4.yml'
      - '.github/workflows/packer-build.yml'

concurrency:
  group: golden-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKER_VERSION: '1.16.0'
  PACKER_PLUGIN_PATH: '~/.packer.d/plugins'
  VIRTIO_VERSION: '0.1.271-1'

jobs:
  changes:
    name: Detect Build Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.detect.outputs.build_required }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Build Changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          required=false
          if [[ "$EVENT_NAME" == 'workflow_dispatch' || "$REF_TYPE" == 'tag' ]]; then
            required=true
          elif [[ "$EVENT_NAME" == 'push' ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              required=true
            elif ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- build scripts .github/workflows/packer-build.yml; then
              required=true
            fi
          fi
          echo "build_required=$required" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Packer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set Up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Cache Packer Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PACKER_PLUGIN_PATH }}
          key: ${{ runner.os }}-packer-${{ hashFiles('build/*.pkr.hcl') }}
          restore-keys: ${{ runner.os }}-packer-
      - name: Initialize Packer
        run: packer init build/
      - name: Check Packer Formatting
        run: packer fmt -check -diff build/
      - name: Validate Packer Syntax
        run: packer validate -syntax-only build/

  test:
    name: Test PowerShell
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Test Modules
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.1.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./scripts -Severity Error,Warning -Recurse
          $issues | Format-Table -AutoSize
          if ($issues) {
              throw 'PSScriptAnalyzer found issues.'
          }
      - name: Run Pester
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.1.0 -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './test-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pester-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build and Publish Image
    needs: [changes, validate, test]
    if: needs.changes.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_DEFAULT_REGION: us-east-1
      PACKER_LOG: '1'
      PACKER_LOG_PATH: packer-debug.log
      S4_BUCKET_ISO: installmedia
      S4_KEY_ISO: virtiowiniso/winisowithvirtio/Winserver2025-VirtIO.iso
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      image_version: ${{ steps.version.outputs.image_version }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y netpbm qemu-system-x86 qemu-utils vncsnapshot xorriso ovmf swtpm swtpm-tools
      - name: Detect QEMU Accelerator
        id: accelerator
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 660 /dev/kvm
            sudo chgrp "$(id -gn)" /dev/kvm
            echo 'value=kvm' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::KVM is unavailable; QEMU will use slower TCG emulation.'
            echo 'value=tcg' >> "$GITHUB_OUTPUT"
          fi
      - name: Set Up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Cache Packer Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PACKER_PLUGIN_PATH }}
          key: ${{ runner.os }}-packer-${{ hashFiles('build/*.pkr.hcl') }}
          restore-keys: ${{ runner.os }}-packer-
      - name: Initialize Packer
        run: packer init build/
      - name: Validate Required Secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_KEY }}
          S4_BUCKET: ${{ secrets.MEGA_S4_BUCKET }}
          S4_ENDPOINT: ${{ secrets.MEGA_S4_ENDPOINT }}
          WINRM_PASSWORD: ${{ secrets.WINRM_PASSWORD }}
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S4_BUCKET S4_ENDPOINT WINRM_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure HCP Packer
        env:
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
          HCP_PROJECT_ID: ${{ secrets.HCP_PROJECT_ID }}
        run: |
          if [[ -n "$HCP_CLIENT_ID" && -n "$HCP_CLIENT_SECRET" && -n "$HCP_PROJECT_ID" ]]; then
            echo 'HCP Packer metadata publishing is enabled.'
          else
            echo 'HCP_PACKER_REGISTRY=OFF' >> "$GITHUB_ENV"
            echo '::notice::HCP Packer metadata publishing is disabled because credentials are incomplete.'
          fi
      - name: Configure S4 Client
        run: |
          aws configure set default.s3.multipart_threshold 64MB
          aws configure set default.s3.multipart_chunksize 64MB
          aws configure set default.s3.max_concurrent_requests 10
      - name: Download Windows ISO
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_KEY }}
          S4_ENDPOINT: ${{ secrets.MEGA_S4_ENDPOINT }}
        run: |
          mkdir -p iso
          aws s3 cp "s3://${S4_BUCKET_ISO}/${S4_KEY_ISO}" iso/Winserver2025-VirtIO.iso --endpoint-url "$S4_ENDPOINT" --no-progress
      - name: Cache VirtIO Build Inputs
        id: virtio-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: virtio-cache
          key: virtio-win-${{ env.VIRTIO_VERSION }}-server-2025-amd64
      - name: Download VirtIO Build Inputs
        if: steps.virtio-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p virtio-cache
          url="https://fedora-virt.repo.nfrance.com/virtio-win/direct-downloads/archive-virtio/virtio-win-${VIRTIO_VERSION}/virtio-win.iso"
          curl --fail --location --retry 3 --output /tmp/virtio-win.iso "$url"
          xorriso -osirrox on -indev /tmp/virtio-win.iso -extract /viostor/2k25/amd64 virtio-cache/viostor
          xorriso -osirrox on -indev /tmp/virtio-win.iso -extract /virtio-win-gt-x64.msi virtio-cache/virtio-win-gt-x64.msi
          rm -f /tmp/virtio-win.iso
      - name: Stage VirtIO Build Inputs
        run: |
          driver_dir=$(dirname "$(find virtio-cache -type f -name viostor.inf -print -quit)")
          installer=$(find virtio-cache -type f -name virtio-win-gt-x64.msi -print -quit)
          if [[ -z "$driver_dir" || ! -f "$driver_dir/viostor.sys" || ! -f "$driver_dir/viostor.cat" || -z "$installer" ]]; then
            echo '::error::Pinned VirtIO build inputs are incomplete.'
            exit 1
          fi
          rm -rf build/config/virtio/viostor
          mkdir -p build/config/virtio/viostor
          cp -a "$driver_dir/." build/config/virtio/viostor/
          cp "$installer" build/config/virtio/virtio-win-gt-x64.msi
      - name: Resolve Image Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            image_version="${GITHUB_REF_NAME#v}"
            image_tag="$GITHUB_REF_NAME"
          else
            image_version="1.0.${GITHUB_RUN_NUMBER}"
            image_tag=latest
          fi
          if ! [[ "$image_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid image version: $image_version"
            exit 1
          fi
          if ! [[ "$image_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid image tag: $image_tag"
            exit 1
          fi
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
      - name: Prepare Packer Inputs
        env:
          ACCELERATOR: ${{ steps.accelerator.outputs.value }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
          LOG_API_KEY: ${{ secrets.LOG_INGEST_KEY }}
          LOG_INGEST_URL: ${{ secrets.CLOUDFLARE_LOG_INGEST_URL }}
          WINRM_PASSWORD: ${{ secrets.WINRM_PASSWORD }}
        run: |
          bash scripts/generate-autounattend.sh
          iso_path="$GITHUB_WORKSPACE/iso/Winserver2025-VirtIO.iso"
          iso_checksum=$(sha256sum "$iso_path" | awk '{print $1}')
          jq -n \
            --arg accelerator "$ACCELERATOR" \
            --arg git_commit "$GITHUB_SHA" \
            --arg image_version "$IMAGE_VERSION" \
            --arg iso_checksum "sha256:$iso_checksum" \
            --arg iso_url "$iso_path" \
            --arg log_api_key "$LOG_API_KEY" \
            --arg log_ingest_url "$LOG_INGEST_URL" \
            --arg winrm_password "$WINRM_PASSWORD" \
            '{accelerator: $accelerator, git_commit: $git_commit, image_version: $image_version, iso_checksum: $iso_checksum, iso_url: $iso_url, log_api_key: $log_api_key, log_ingest_url: $log_ingest_url, winrm_password: $winrm_password, winrm_timeout: "2h"}' \
            > build/ci.pkrvars.json
      - name: Validate Packer Build
        env:
          HCP_PACKER_REGISTRY: 'OFF'
        run: packer validate -var-file=build/ci.pkrvars.json build/
      - name: Build Image
        env:
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
          HCP_ORGANIZATION_ID: ${{ secrets.HCP_ORGANIZATION_ID }}
          HCP_PACKER_BUILD_FINGERPRINT: run.${{ github.run_id }}.attempt.${{ github.run_attempt }}
          HCP_PROJECT_ID: ${{ secrets.HCP_PROJECT_ID }}
        run: |
          mkdir -p vnc-captures
          (
            while true; do
              vncsnapshot -quiet -allowblank 127.0.0.1:0 "vnc-captures/screen_$(date +%H%M%S).jpg" >/dev/null 2>&1 || true
              sleep 30
            done
          ) &
          vnc_pid=$!
          trap 'kill "$vnc_pid" 2>/dev/null || true' EXIT
          packer build -force -on-error=cleanup -color=false -timestamp-ui -var-file=build/ci.pkrvars.json build/
      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packer-diagnostics
          path: |
            packer-debug.log
            vnc-captures/
          if-no-files-found: warn
          retention-days: 7
      - name: Compress Image
        run: |
          mkdir -p dist
          qemu-img convert -O qcow2 -c output-*/*.qcow2 dist/image.qcow2
          (
            cd dist
            sha256sum image.qcow2 > image.sha256
          )
      - name: Publish Image to S4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_KEY }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          S4_BUCKET: ${{ secrets.MEGA_S4_BUCKET }}
          S4_ENDPOINT: ${{ secrets.MEGA_S4_ENDPOINT }}
        run: |
          destination="s3://${S4_BUCKET}/windows-server/${IMAGE_TAG}"
          aws s3 cp dist/image.qcow2 "$destination/image.qcow2" --endpoint-url "$S4_ENDPOINT" --no-progress
          aws s3 cp dist/image.sha256 "$destination/image.sha256" --endpoint-url "$S4_ENDPOINT" --no-progress
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            latest="s3://${S4_BUCKET}/windows-server/latest"
            aws s3 cp "$destination/image.qcow2" "$latest/image.qcow2" --endpoint-url "$S4_ENDPOINT" --no-progress
            aws s3 cp "$destination/image.sha256" "$latest/image.sha256" --endpoint-url "$S4_ENDPOINT" --no-progress
          fi

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Release Bundle
        shell: pwsh
        run: |
          $script = './scripts/cloudbase-single-deploy.ps1'
          $hash = (Get-FileHash -Path $script -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cloudbase-single-deploy.ps1" | Set-Content ./scripts/cloudbase-single-deploy.ps1.sha256
          Compress-Archive -Path ./scripts/* -DestinationPath ./cloudbase-deployment-bundle.zip -Force
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.image_tag }}
        shell: pwsh
        run: |
          $assets = @(
              './scripts/cloudbase-single-deploy.ps1',
              './scripts/cloudbase-single-deploy.ps1.sha256',
              './cloudbase-deployment-bundle.zip'
          )
          if (gh release view $env:RELEASE_TAG 2>$null) {
              gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
              gh release create $env:RELEASE_TAG @assets --title "Release $env:RELEASE_TAG" --generate-notes --verify-tag
          }
      - name: Archive Release Bundle to S4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_KEY }}
          RELEASE_TAG: ${{ needs.build.outputs.image_tag }}
          S4_BUCKET: ${{ secrets.MEGA_S4_BUCKET }}
          S4_ENDPOINT: ${{ secrets.MEGA_S4_ENDPOINT }}
        shell: pwsh
        run: |
          $destination = "s3://$env:S4_BUCKET/releases/$env:RELEASE_TAG/bundle.zip"
          aws s3 cp ./cloudbase-deployment-bundle.zip $destination --endpoint-url $env:S4_ENDPOINT --no-progress
          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to archive the release bundle.'
          }
