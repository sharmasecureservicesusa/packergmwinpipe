name: S4 Image Retention

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: s4-image-retention
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup:
    name: Prune Expired Images
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
      - name: Clean S4 Storage
        env:
          RCLONE_CONFIG_MEGAS4_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY }}
          RCLONE_CONFIG_MEGAS4_ACL: private
          RCLONE_CONFIG_MEGAS4_ENDPOINT: ${{ secrets.MEGA_S4_ENDPOINT }}
          RCLONE_CONFIG_MEGAS4_ENV_AUTH: 'false'
          RCLONE_CONFIG_MEGAS4_PROVIDER: Other
          RCLONE_CONFIG_MEGAS4_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_KEY }}
          RCLONE_CONFIG_MEGAS4_TYPE: s3
          S4_BUCKET: ${{ secrets.MEGA_S4_BUCKET }}
        run: |
          missing=0
          for name in RCLONE_CONFIG_MEGAS4_ACCESS_KEY_ID RCLONE_CONFIG_MEGAS4_ENDPOINT RCLONE_CONFIG_MEGAS4_SECRET_ACCESS_KEY S4_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit "$missing"
          fi
          rclone cleanup "megas4:${S4_BUCKET}"
          rclone delete "megas4:${S4_BUCKET}/windows-server/" --min-age 60d --exclude 'latest/**' --verbose
          rclone rmdirs "megas4:${S4_BUCKET}/windows-server/" --leave-root --verbose
