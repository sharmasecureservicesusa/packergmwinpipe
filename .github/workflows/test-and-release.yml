name: Test and Publish Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'  # Triggers release job on version tags (e.g., v1.0.0)
  pull_request:
    branches: [ main ]

permissions:
  contents: write       # Required to create GitHub releases and upload assets
  checks: write         # Required to publish test result badges in GitHub
  pull-requests: write  # Required to comment test summaries on PRs

jobs:
  # =========================================================================
  # JOB 1: Test & Lint (Runs on PRs, Commits, and Tags)
  # =========================================================================
  test:
    name: Run Pester Tests & Linters
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Install PowerShell modules required for testing
      - name: Install Pester & PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      # 2. Static Code Analysis (checks syntax, security, and best practices)
      - name: Lint PowerShell Code with PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./scripts -Severity Error,Warning -Recurse
          if ($issues) {
              $issues | Format-Table -AutoSize
              if ($issues.Where({$_.Severity -eq 'Error'})) {
                  Write-Error "Critical linting errors found by PSScriptAnalyzer!"
                  exit 1
              }
          }

      # 3. Execute all unit and mock tests in the tests/ directory
      - name: Run Pester Unit Tests
        shell: pwsh
        run: |
          $config = [PesterConfiguration]::Default
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './test-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXML'
          $config.Output.Verbosity = 'Detailed'

          Invoke-Pester -Configuration $config

      # 4. Publish test report and summary directly into GitHub Actions UI
      - name: Publish Test Results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Pester Test Results
          path: './test-results.xml'
          reporter: dotnet-nunit

  # =========================================================================
  # JOB 2: Publish Release (ONLY runs if tests pass AND on a git tag)
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: test  # HARD GATE: If any test fails, release NEVER executes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Generate SHA-256 integrity hash for the deployment script
      - name: Generate Checksums
        shell: pwsh
        run: |
          $scriptFile = "./scripts/cloudbase-single-deploy.ps1"
          $hash = (Get-FileHash -Path $scriptFile -Algorithm SHA256).Hash
          "$hash  cloudbase-single-deploy.ps1" | Out-File -FilePath "./scripts/cloudbase-single-deploy.ps1.sha256" -Encoding utf8
          Write-Host "Generated SHA256: $hash" -ForegroundColor Green

      # 2. Package all provisioning scripts into a single downloadable zip asset
      - name: Bundle Provisioning Scripts
        shell: pwsh
        run: |
          Compress-Archive -Path ./scripts/* -DestinationPath ./cloudbase-deployment-bundle.zip -Force
          Write-Host "Created deployment bundle zip archive." -ForegroundColor Green

      # 3. Create the official GitHub Release using GitHub CLI (gh)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} `
            ./scripts/cloudbase-single-deploy.ps1 `
            ./scripts/cloudbase-single-deploy.ps1.sha256 `
            ./cloudbase-deployment-bundle.zip `
            --title "Release ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag

      - name: Archive Release Bundle to MEGA S4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          aws s3 cp ./cloudbase-deployment-bundle.zip \
            s3://${{ secrets.MEGA_S4_BUCKET }}/releases/${{ github.ref_name }}/bundle.zip \
            --endpoint-url ${{ secrets.MEGA_S4_ENDPOINT }}
