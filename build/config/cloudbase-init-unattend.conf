[DEFAULT]
# ----------------------------------------------------------------------
# Identity & Account Basics
# ----------------------------------------------------------------------
username=Administrator
groups=Administrators
inject_user_password=true
first_logon_behaviour=no
netbios_host_name_compatibility=false

# ----------------------------------------------------------------------
# Metadata Services (Ordered by priority)
# ----------------------------------------------------------------------
# Must match your cloud environment (ConfigDrive for Proxmox/Harvester/OpenStack,
# HttpService for AWS/OpenStack 169.254.169.254, OvfService for VMware)
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,cloudbaseinit.metadata.services.httpservice.HttpService,cloudbaseinit.metadata.services.ec2service.EC2Service

# Scan formats for attached metadata configuration drives
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true

# ----------------------------------------------------------------------
# Early Boot Plugins (Specialize Phase Only)
# ----------------------------------------------------------------------
# Only execute foundational hardware, network, and disk expansion plugins here
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin

# Network interface discovery
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true

# ----------------------------------------------------------------------
# Execution Controls
# ----------------------------------------------------------------------
# Prevent reboots during Sysprep specialize
allow_reboot=false
stop_service_on_exit=false
check_latest_version=false

# ----------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------
verbose=true
debug=false
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init-unattend.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=COM1,115200,N,8
